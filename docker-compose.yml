version: '3.8'

services:
  backend:
    build: ./backend
    container_name: turgon-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/rules:/app/rules
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./RuleForge-Frontend
    container_name: turgon-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
