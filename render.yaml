services:
  # Backend Flask API (Docker)
  - type: web
    name: turgon-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: starter # or your preferred plan
    envVars:
      - key: GROQ_API_KEY
        sync: false # Must be set in Render Dashboard
      - key: TURGON_MODEL
        value: llama-3.3-70b-versatile
