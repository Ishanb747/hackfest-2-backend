services:
  # Backend Flask API (Docker)
  - type: web
    name: turgon-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false # Must be set in Render Dashboard
      - key: TURGON_MODEL
        value: llama-3.3-70b-versatile

  # Frontend React Dashboard
  - type: static
    name: turgon-frontend
    env: node
    buildCommand: npm install && npm run build
    publishDir: build
    rootDir: RuleForge-Frontend
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: turgon-backend
          property: host
